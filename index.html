<div id="root"><div class="aace-loading">Loading portfolio&hellip;</div></div>

<script>
  // Watchdog: if the app hasn't mounted within 15s, name the missing dependency
  // instead of showing an endless loading state.
  setTimeout(function () {
    var el = document.querySelector(".aace-loading");
    if (!el) return; // app mounted fine
    var missing = [];
    if (typeof React === "undefined") missing.push("React");
    if (typeof ReactDOM === "undefined") missing.push("ReactDOM");
    if (typeof Recharts === "undefined") missing.push("Recharts");
    if (typeof Babel === "undefined") missing.push("Babel");
    el.textContent = missing.length
      ? "Could not load: " + missing.join(", ") + ". Check your connection and refresh."
      : "The dashboard failed to start. Open the browser console for details, then refresh.";
  }, 15000);
</script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;
const {
  ResponsiveContainer,
  BarChart,
  Bar,
  XAxis,
  YAxis,
  CartesianGrid,
  Tooltip,
  Treemap,
  LineChart,
  Line,
} = Recharts;

// ============================================================
// INLINE ICONS (replaces lucide-react for CDN build)
// ============================================================
function IconBase({ size = 16, style, children }) {
  return (
    <svg
      width={size} height={size} viewBox="0 0 24 24"
      fill="none" stroke="currentColor" strokeWidth="2"
      strokeLinecap="round" strokeLinejoin="round"
      style={style} aria-hidden="true"
    >
      {children}
    </svg>
  );
}
function Search(props) {
  return (
    <IconBase {...props}>
      <circle cx="11" cy="11" r="8" />
      <line x1="21" y1="21" x2="16.65" y2="16.65" />
    </IconBase>
  );
}
function X(props) {
  return (
    <IconBase {...props}>
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </IconBase>
  );
}
function Filter(props) {
  return (
    <IconBase {...props}>
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
    </IconBase>
  );
}

// Honest fair-value rules per ASC 820 spirit:
//  - Acquired / Partial Exit: realized proceeds if known, else cost basis as floor
//  - Bankrupt: realized proceeds if known, else $0
//  - Alive / Fundraising: current mark if known, else cost basis (held at cost)
function fairValue(c) {
  if (c.status === "Bankrupt") return c.realizedProceeds ?? 0;
  if (c.status === "Acquired" || c.status === "Partial Exit") {
    // For partial exits, residual mark stacks on top of realized proceeds
    if (c.status === "Partial Exit" && c.currentMark !== null) {
      return (c.realizedProceeds ?? 0) + c.currentMark;
    }
    return c.realizedProceeds ?? c.invested;
  }
  // Alive or Fundraising
  return c.currentMark ?? c.invested;
}
function isMarked(c) {
  if (c.status === "Bankrupt") return c.realizedProceeds !== null;
  if (c.status === "Acquired" || c.status === "Partial Exit") return c.realizedProceeds !== null;
  return c.currentMark !== null;
}

// Spelled-out numerals for editorial copy, so headline prose tracks the data

const NUM_WORDS = [
  "zero", "one", "two", "three", "four", "five", "six", "seven", "eight",
  "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen",
  "sixteen", "seventeen", "eighteen", "nineteen", "twenty", "twenty-one",
  "twenty-two", "twenty-three", "twenty-four", "twenty-five",
];
function numWord(n) {
  return NUM_WORDS[n] || String(n);
}
function NumWord(n) {
  const w = numWord(n);
  return w.charAt(0).toUpperCase() + w.slice(1);
}

// Compact USD formatter — "$50K", "$1.2M", "$900K"
function fmtUsd(n, { compact = true, withSign = false } = {}) {
  if (n === null || n === undefined) return "—";
  const sign = withSign && n > 0 ? "+" : "";
  const abs = Math.abs(n);
  if (!compact || abs < 1000) return `${sign}$${n.toLocaleString()}`;
  if (abs < 1_000_000) {
    const v = n / 1000;
    return `${sign}$${v % 1 === 0 ? v.toFixed(0) : v.toFixed(1)}K`;
  }
  const v = n / 1_000_000;
  return `${sign}$${v % 1 === 0 ? v.toFixed(1) : v.toFixed(2)}M`;
}

  COLORS.ink, "#3F3F3F", "#5C5C5C", COLORS.bluff,

function TreemapCell(props) {
  const { x, y, width, height, name, value, payload, depth, index } = props;
  if (width <= 0 || height <= 0) return null;
  // Only render leaf nodes (depth === 1 in Recharts Treemap)
  if (depth !== undefined && depth !== 1) return null;
  const fill = (payload && payload.fill) || props.fill;
  const isDark = fill === COLORS.ink || fill === "#3F3F3F" || fill === "#5C5C5C" || fill === COLORS.bluff || fill === COLORS.goldDeep;
  const txt = isDark ? COLORS.paper : COLORS.ink;
  const pad = 10;
  // Scale the name down before hiding it, and never let text escape its cell.
  const nameSize = width > 110 ? 13 : width > 78 ? 11.5 : 10;
  const approxNameWidth = String(name || "").length * nameSize * 0.62;
  const showName = height > 30 && (width - pad * 2) > approxNameWidth;
  // Tall, narrow cells (e.g. a 1-deal sector) can't fit a horizontal name,
  // but the name fits rotated 90 degrees along the cell's height.
  const showNameVertical = !showName && width > 20 && (height - pad * 2) > approxNameWidth;
  const countSize = Math.max(11, Math.min(width / 4, height / 2.5, 36));
  const showCount = width > 26 && height > (showName ? 52 : (showNameVertical ? approxNameWidth + pad * 2 + 24 : 26));
  const cellValue = value ?? (payload && payload.size);
  const clipId = `tm-clip-${index != null ? index : `${Math.round(x)}-${Math.round(y)}`}`;
  return (
    <g>
      <defs>
        <clipPath id={clipId}>
          <rect x={x} y={y} width={width} height={height} />
        </clipPath>
      </defs>
      <rect x={x} y={y} width={width} height={height} fill={fill} stroke={COLORS.bg} strokeWidth={2} />
      <g clipPath={`url(#${clipId})`}>
        {showName && (
          <text
            x={x + pad} y={y + nameSize + 7}
            fontFamily={fontBody} fontSize={nameSize} fontWeight={600}
            fill={txt} stroke="none"
          >{name}</text>
        )}
        {showNameVertical && (
          <text
            x={x + width / 2} y={y + pad}
            transform={`rotate(90 ${x + width / 2} ${y + pad})`}
            fontFamily={fontBody} fontSize={Math.min(nameSize, width - 6)} fontWeight={600}
            fill={txt} stroke="none"
            dominantBaseline="central"
          >{name}</text>
        )}
        {showCount && (
          <text
            x={x + pad} y={y + height - 10}
            fontFamily={fontHead} fontSize={countSize}
            fontWeight={500}
            fill={txt} stroke="none"
          >{cellValue}</text>
        )}
      </g>
    </g>
  );
}

function CompanyExplorer() {
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("All");
  const [sortBy, setSortBy] = useState("year");
  const [sortDir, setSortDir] = useState("desc");

  const filtered = useMemo(() => {
    let rows = portfolioData.filter(c => {
      const matchQuery = !query ||
        c.name.toLowerCase().includes(query.toLowerCase()) ||
        c.industry.toLowerCase().includes(query.toLowerCase()) ||
        c.hq.toLowerCase().includes(query.toLowerCase());
      const matchStatus = statusFilter === "All" || c.status === statusFilter;
      return matchQuery && matchStatus;
    });
    rows.sort((a, b) => {
      let av = a[sortBy], bv = b[sortBy];
      if (typeof av === "string") { av = av.toLowerCase(); bv = bv.toLowerCase(); }
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
    return rows;
  }, [query, statusFilter, sortBy, sortDir]);

  const toggleSort = (col) => {
    if (sortBy === col) setSortDir(sortDir === "asc" ? "desc" : "asc");

          />
          {query && (
            <button
              onClick={() => setQuery("")}

  { id: "history", label: "History" },
];

function StickyNav() {
  const [active, setActive] = useState("overview");

  useEffect(() => {
    const handler = () => {
      let cur = "overview";
      for (const s of NAV_SECTIONS) {
        const el = document.getElementById(s.id);
        if (el && el.getBoundingClientRect().top < 160) cur = s.id;
      }
      setActive(cur);
    };
    handler();
    window.addEventListener("scroll", handler, { passive: true });
    return () => window.removeEventListener("scroll", handler);
  }, []);

  // Explicit click handler — works reliably in both iframed artifact contexts
  // and standalone browser windows. Uses scrollIntoView (the standard API)
  // instead of computed offsets, since scrollMarginTop on each section
  // handles the sticky-nav offset automatically.
  const handleNavClick = (e, id) => {
    e.preventDefault();
    e.stopPropagation();
    const el = document.getElementById(id);
    if (!el) return;
    try {
      el.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (err) {
      // Fallback for older browsers that don't support smooth option object
      el.scrollIntoView();
    }
    if (history.replaceState) history.replaceState(null, "", `#${id}`);
    setActive(id);
  };

  return (
    <nav style={{
      position: "sticky", top: 0, zIndex: 50,
      background: "rgba(250, 250, 247, 0.92)",
      backdropFilter: "blur(8px)",
      WebkitBackdropFilter: "blur(8px)",
      borderBottom: `1px solid rgba(0,0,0,0.08)`,
    }}>
      <div style={{
        maxWidth: 1280, margin: "0 auto",
        padding: "0 32px",
        display: "flex", alignItems: "center", justifyContent: "space-between",
        height: 56,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <img
            src={AACE_LOGO}
            alt="AACE Venture Fund"
            style={{
              width: 38, height: 38,
              objectFit: "contain",
              display: "block",
            }}
          />
          <span style={{
            fontFamily: fontHead, fontSize: 15, fontWeight: 500,
            color: COLORS.ink, letterSpacing: "-0.01em",
          }}>AACE Venture Fund</span>
          <span style={{
            fontFamily: fontMono, fontSize: 10,
            letterSpacing: "0.16em", textTransform: "uppercase",
            color: COLORS.mute,
            display: "inline-block",
          }} className="aace-nav-meta">Portfolio Review · Aug 2026</span>
        </div>
        <div style={{ display: "flex", gap: 4, alignItems: "center" }} className="aace-nav-links">
          {NAV_SECTIONS.map(s => (
            <button
              key={s.id}
              type="button"
              onClick={(e) => handleNavClick(e, s.id)}
              style={{
                padding: "6px 12px",
                fontFamily: fontBody, fontSize: 12.5,
                fontWeight: active === s.id ? 600 : 500,
                color: active === s.id ? COLORS.ink : COLORS.mute,
                background: "transparent",
                border: "none",
                cursor: "pointer",
                position: "relative",
                letterSpacing: "0.01em",
                transition: "color 0.15s",
              }}
              onMouseEnter={(e) => { if (active !== s.id) e.currentTarget.style.color = COLORS.ink; }}
              onMouseLeave={(e) => { if (active !== s.id) e.currentTarget.style.color = COLORS.mute; }}
            >
              {s.label}
              {active === s.id && (
                <span style={{
                  position: "absolute", bottom: -19, left: 12, right: 12,
                  height: 2, background: COLORS.gold,
                }} />
              )}
            </button>
          ))}
        </div>
      </div>
    </nav>
  );
}

          eyebrow="Pacing"
          title="Capital deployed by vintage"
          footnote="Fair value equals current mark where available, otherwise cost basis. The active column shows positions in this vintage that are still operating or fundraising."
        >
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead>
                <tr>
                  {[
                    ["Vintage", "left"],
                    ["Deals", "right"],
                    ["Active", "right"],
                    ["Deployed", "right"],
                    ["Fair Value", "right"],
                    ["Status", "left"],
                  ].map(([h, a]) => (
                    <th key={h} style={{
                      padding: "10px 12px",
                      textAlign: a,
                      fontFamily: fontMono, fontSize: 9.5,
                      letterSpacing: "0.16em", textTransform: "uppercase",
                      color: COLORS.mute, fontWeight: 600,
                      borderBottom: `1px solid ${COLORS.ink}`,
                    }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {vintageCapital.map((v, i) => {
                  const allActive = v.active === v.deals;
                  const allResolved = v.active === 0;
                  return (
                    <tr key={v.year} style={{
                      borderBottom: i === vintageCapital.length - 1 ? "none" : `1px solid rgba(0,0,0,0.06)`,
                    }}>
                      <td style={{
                        padding: "12px",
                        fontFamily: fontHead, fontSize: 16, fontWeight: 500,
                        color: COLORS.ink,
                      }}>{v.year}</td>
                      <td style={{ ...cellNum, padding: "12px" }}>{v.deals}</td>
                      <td style={{
                        ...cellNum, padding: "12px",
                        color: v.active > 0 ? COLORS.ink : COLORS.muteSoft,
                        fontWeight: v.active > 0 ? 600 : 400,
                      }}>{v.active}</td>
                      <td style={{
                        ...cellNum, padding: "12px",
                        color: COLORS.ink, fontWeight: 500,
                      }}>{fmtUsd(v.deployed)}</td>
                      <td style={{
                        ...cellNum, padding: "12px",
                        color: COLORS.ink, fontWeight: 500,
                      }}>{fmtUsd(v.fairValue)}</td>
                      <td style={{ padding: "12px" }}>
                        <span style={{
                          fontFamily: fontMono, fontSize: 10,
                          letterSpacing: "0.14em", textTransform: "uppercase",
                          fontWeight: allActive ? 700 : 500,
                          color: allActive ? COLORS.ink : allResolved ? COLORS.mute : COLORS.inkSoft,
                        }}>
                          {allActive ? "Fully Active" : allResolved ? "Fully Resolved" : "Mixed"}
                        </span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr style={{ borderTop: `1px solid ${COLORS.ink}` }}>
                  <td style={{
                    padding: "14px 12px",
                    fontFamily: fontMono, fontSize: 10,
                    letterSpacing: "0.18em", textTransform: "uppercase",
                    color: COLORS.ink, fontWeight: 700,
                  }}>Total</td>
                  <td style={{ ...cellNum, padding: "14px 12px", color: COLORS.ink, fontWeight: 700 }}>
                    {totals.count}
                  </td>
                  <td style={{ ...cellNum, padding: "14px 12px", color: COLORS.ink, fontWeight: 700 }}>
                    {totals.active}
                  </td>
                  <td style={{ ...cellNum, padding: "14px 12px", color: COLORS.ink, fontWeight: 700 }}>
                    {fmtUsd(capital.deployed)}
                  </td>
                  <td style={{ ...cellNum, padding: "14px 12px", color: COLORS.ink, fontWeight: 700 }}>
                    {fmtUsd(capital.totalFairValue)}
                  </td>
                  <td />
                </tr>
              </tfoot>
            </table>
          </div>
        </Panel>
      </div>

      {/* Per-position economics */}
      <div style={{ marginTop: 24 }}>
        <PositionEconomicsTable />
      </div>

      {/* Pending updates / in-flight marks */}
      <PendingUpdatesPanel />

      {/* Methodology callout */}
      <div style={{
        marginTop: 24,
        background: COLORS.ink,
        color: COLORS.paper,
        padding: "28px 28px 24px",
        position: "relative",
      }}>
        <span style={{
          position: "absolute", top: 0, left: 0,
          width: 64, height: 8, background: COLORS.gold,
        }} />
        <div style={{
          fontFamily: fontMono, fontSize: 10,
          letterSpacing: "0.22em", textTransform: "uppercase",
          color: COLORS.gold, marginBottom: 14,
        }}>Valuation Methodology</div>
        <div style={{
          display: "grid",
          gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))",
          gap: 24,
          fontFamily: fontBody, fontSize: 13.5,
          lineHeight: 1.55, color: "rgba(255,255,255,0.85)",
        }}>
          <div>
            <div style={{ color: COLORS.gold, fontWeight: 600, marginBottom: 6, fontSize: 12.5, letterSpacing: "0.04em", textTransform: "uppercase" }}>
              Active positions
            </div>
            Marked at last priced-round post-money × AACE ownership, or at company-stated
            unrealized MOIC × cost basis. Positions without a recent verifiable valuation
            are held at cost as a conservative floor.
          </div>
          <div>
            <div style={{ color: COLORS.gold, fontWeight: 600, marginBottom: 6, fontSize: 12.5, letterSpacing: "0.04em", textTransform: "uppercase" }}>
              Realized exits
            </div>
            Booked at actual cash + liquid stock received. For partial exits, the residual
            stake is marked separately and added to cumulative proceeds for total economic
            outcome.
          </div>
          <div>
            <div style={{ color: COLORS.gold, fontWeight: 600, marginBottom: 6, fontSize: 12.5, letterSpacing: "0.04em", textTransform: "uppercase" }}>
              Worthless positions
            </div>
            Bankruptcies and acquisitions where AACE assumes no residual value (Bellwethr,
            GRIT, RNAissance) are recorded at the realized cash component only.
          </div>
        </div>
      </div>
    </section>
  );
}

// ---- Pending updates panel ---------------------------------------------
function PendingUpdatesPanel() {
  // In flight: a priced round or proceeds figure the fund expects to land soon,
  // flagged explicitly in CAPITAL_OVERRIDES rather than inferred from note text.
  const inFlight = portfolioData.filter(c => c.markPending);
  // Missing data: no recent verifiable mark and no in-flight signal
  const missing = portfolioData.filter(c => {
    if (inFlight.includes(c)) return false;
    if (c.status !== "Alive" && c.status !== "Fundraising") return false;
    return c.currentMark === null;
  });

  if (inFlight.length === 0 && missing.length === 0) return null;

  const renderRow = (c, accentColor) => (
    <div key={c.id} style={{
      display: "grid",
      gridTemplateColumns: "auto 1fr auto",
      gap: 16, alignItems: "start",
      paddingBottom: 14,
      borderBottom: `1px dashed rgba(0,0,0,0.08)`,
    }}>
      <div style={{
        width: 6, height: 6, borderRadius: "50%",
        background: accentColor,
        marginTop: 8,
      }} />
      <div>
        <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
          <span style={{
            fontFamily: fontHead, fontSize: 17, fontWeight: 500,
            color: COLORS.ink, letterSpacing: "-0.005em",
          }}>{c.name}</span>
          <StatusPill status={c.status} dense />
        </div>
        <div style={{
          fontFamily: fontBody, fontSize: 13, color: COLORS.inkSoft,
          lineHeight: 1.5, marginTop: 6,
        }}>{c.markNote || "No recent valuation data on file."}</div>
      </div>
      <div style={{
        fontFamily: fontMono, fontSize: 10,
        letterSpacing: "0.14em", textTransform: "uppercase",
        color: COLORS.mute, whiteSpace: "nowrap", paddingTop: 4,
      }}>
        {fmtUsd(c.invested)} cost
      </div>
    </div>
  );

  return (
    <div style={{ marginTop: 24, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }} className="aace-2col">
      {/* In flight */}
      {inFlight.length > 0 && (
        <Panel
          eyebrow="In Flight"
          title="Marks awaiting confirmation"
          footnote="Updates expected from the company or a credible third party. Will be reflected in marks once received."
        >
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            {inFlight.map(c => renderRow(c, COLORS.gold))}
          </div>
        </Panel>
      )}
      {/* Missing data */}
      {missing.length > 0 && (
        <Panel
          eyebrow="Held at Cost"
          title="Active positions without a recent mark"
          footnote="No priced round has been disclosed to AACE recently enough to support a verified mark. Held at cost as the conservative floor."
        >
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            {missing.map(c => renderRow(c, COLORS.muteSoft))}
          </div>
        </Panel>
      )}
    </div>
  );
}

// ---- Per-position economics table -------------------------------------
function PositionEconomicsTable() {
  // Sort by fair value descending; null marks tied broken by year descending
  const rows = [...portfolioData].sort((a, b) => fairValue(b) - fairValue(a) || b.year - a.year);
  return (
    <Panel
      eyebrow="Position Detail"
      title="Per-company economics"
      footnote="Mark date shows when the underlying valuation data was sourced. Stale marks (older than 18 months) are flagged. MOIC is fair value divided by cost. Sources are documented in the underlying data file."
    >
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 720 }}>
          <thead>
            <tr>
              {[
                ["Company", "left"],
                ["Status", "left"],
                ["Cost", "right"],
                ["Realized", "right"],
                ["Mark", "right"],
                ["Fair Value", "right"],
                ["MOIC", "right"],
                ["As Of", "left"],
              ].map(([h, a]) => (
                <th key={h} style={{
                  padding: "10px 12px",
                  textAlign: a,
                  fontFamily: fontMono, fontSize: 9.5,
                  letterSpacing: "0.16em", textTransform: "uppercase",
                  color: COLORS.mute, fontWeight: 600,
                  borderBottom: `1px solid ${COLORS.ink}`,
                  whiteSpace: "nowrap",
                }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((c, i) => {
              const fv = fairValue(c);
              const moic = c.invested > 0 ? fv / c.invested : 0;
              const moicTone = moic >= 1.5 ? COLORS.ink
                : moic >= 1 ? COLORS.inkSoft
                : moic >= 0.5 ? COLORS.bluff
                : COLORS.muteSoft;
              const moicWeight = moic >= 1.5 ? 600 : 500;
              const isStale = c.markAsOf && (() => {
                const ageMonths = (new Date(AS_OF_ISO) - new Date(c.markAsOf)) / (1000 * 60 * 60 * 24 * 30);
                return ageMonths > 18;
              })();
              const dateLabel = c.markAsOf
                ? new Date(c.markAsOf).toLocaleDateString("en-US", { month: "short", year: "numeric" })
                : "—";
              return (
                <tr key={c.id} style={{
                  borderBottom: i === rows.length - 1 ? "none" : `1px solid rgba(0,0,0,0.06)`,
                  transition: "background 0.15s",
                }}
                onMouseEnter={(e) => e.currentTarget.style.background = COLORS.card}
                onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}
                >
                  <td style={{ padding: "12px" }}>
                    <div style={{
                      fontFamily: fontHead, fontSize: 15, fontWeight: 500,
                      color: COLORS.ink, letterSpacing: "-0.005em",
                    }}>{c.name}</div>
                    {c.markNote && (
                      <div title={c.markNote} style={{
                        fontFamily: fontBody, fontSize: 11,
                        color: COLORS.mute, marginTop: 2,
                        maxWidth: 260,
                        overflow: "hidden", textOverflow: "ellipsis",
                        whiteSpace: "nowrap",
                      }}>{c.markNote}</div>
                    )}
                  </td>
                  <td style={{ padding: "12px" }}>
                    <StatusPill status={c.status} dense />
                  </td>
                  <td style={{ ...cellNum, padding: "12px", color: COLORS.inkSoft }}>
                    {fmtUsd(c.invested)}
                  </td>
                  <td style={{
                    ...cellNum, padding: "12px",
                    color: c.realizedProceeds !== null && c.realizedProceeds > 0 ? COLORS.ink : COLORS.muteSoft,
                    fontWeight: c.realizedProceeds !== null && c.realizedProceeds > 0 ? 600 : 400,
                  }}>
                    {c.realizedProceeds !== null ? fmtUsd(c.realizedProceeds) : "—"}
                  </td>
                  <td style={{
                    ...cellNum, padding: "12px",
                    color: c.currentMark !== null ? COLORS.ink : COLORS.muteSoft,
                    fontWeight: c.currentMark !== null ? 600 : 400,
                  }}>
                    {c.currentMark !== null ? fmtUsd(c.currentMark) : "—"}
                  </td>
                  <td style={{
                    ...cellNum, padding: "12px",
                    fontFamily: fontHead, fontSize: 15, fontWeight: 500,
                    color: COLORS.ink, letterSpacing: "-0.005em",
                  }}>
                    {fmtUsd(fv)}
                  </td>
                  <td style={{
                    ...cellNum, padding: "12px",
                    fontFamily: fontMono, fontSize: 13,
                    color: moicTone, fontWeight: moicWeight,
                  }}>
                    {moic === 0 ? "0.00×" : `${moic.toFixed(2)}×`}
                  </td>
                  <td style={{
                    padding: "12px",
                    fontFamily: fontMono, fontSize: 11,
                    color: isStale ? COLORS.bluff : COLORS.mute,
                    letterSpacing: "0.04em",
                    whiteSpace: "nowrap",
                  }}>
                    {dateLabel}
                    {isStale && (
                      <span title="Mark older than 18 months" style={{
                        marginLeft: 6, padding: "1px 5px",
                        background: COLORS.gold, color: COLORS.ink,
                        fontSize: 9, letterSpacing: "0.1em",
                        fontWeight: 700, textTransform: "uppercase",
                      }}>stale</span>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
          <tfoot>
            <tr style={{ borderTop: `1px solid ${COLORS.ink}` }}>
              <td colSpan={2} style={{
                padding: "14px 12px",
                fontFamily: fontMono, fontSize: 10,
                letterSpacing: "0.18em", textTransform: "uppercase",
                color: COLORS.ink, fontWeight: 700,
              }}>Portfolio Total</td>
              <td style={{ ...cellNum, padding: "14px 12px", color: COLORS.ink, fontWeight: 700 }}>
                {fmtUsd(capital.deployed)}
              </td>
              <td style={{ ...cellNum, padding: "14px 12px", color: COLORS.ink, fontWeight: 700 }}>
                {fmtUsd(capital.realizedProceeds)}
              </td>
              <td style={{ ...cellNum, padding: "14px 12px", color: COLORS.ink, fontWeight: 700 }}>
                {fmtUsd(portfolioData.reduce((s, c) => s + (c.currentMark || 0), 0))}
              </td>
              <td style={{ ...cellNum, padding: "14px 12px",
                fontFamily: fontHead, fontSize: 18, fontWeight: 500,
                color: COLORS.ink, letterSpacing: "-0.01em",
              }}>
                {fmtUsd(capital.totalFairValue)}
              </td>
              <td style={{
                ...cellNum, padding: "14px 12px",
                fontFamily: fontMono, fontSize: 14, fontWeight: 700,
                color: COLORS.ink,
              }}>
                {capital.tvpi.toFixed(2)}×
              </td>
              <td />
            </tr>
          </tfoot>
        </table>
      </div>
    </Panel>
  );
}

function MarkCoverageWidget() {
  const activeCount = totals.active;
  const activeMarked = capital.activeMarked;
  const activeAtCost = activeCount - activeMarked;
  const exitedKnown = portfolioData.filter(c =>
    (c.status === "Acquired" || c.status === "Partial Exit") && c.realizedProceeds !== null
  ).length;
  const exitedTotal = totals.exits;
  const exitedUnknown = exitedTotal - exitedKnown;

  // Big gauge: % of active positions marked
  const pct = activeCount > 0 ? Math.round((activeMarked / activeCount) * 100) : 0;
  const ringSize = 132;
  const ringStroke = 12;
  const ringRadius = (ringSize - ringStroke) / 2;
  const ringCircumference = 2 * Math.PI * ringRadius;
  const ringOffset = ringCircumference - (pct / 100) * ringCircumference;

  return (
    <div>
      <div style={{
        display: "flex", alignItems: "center", gap: 24,
        paddingBottom: 20,
        borderBottom: `1px dashed rgba(0,0,0,0.1)`,
        marginBottom: 18,
      }}>
        {/* SVG ring */}
        <div style={{ position: "relative", width: ringSize, height: ringSize, flexShrink: 0 }}>
          <svg width={ringSize} height={ringSize} style={{ display: "block", transform: "rotate(-90deg)" }}>
            <circle
              cx={ringSize/2} cy={ringSize/2} r={ringRadius}
              fill="none" stroke={COLORS.card} strokeWidth={ringStroke}
            />
            <circle
              cx={ringSize/2} cy={ringSize/2} r={ringRadius}
              fill="none" stroke={COLORS.gold} strokeWidth={ringStroke}
              strokeLinecap="round"
              strokeDasharray={ringCircumference}
              strokeDashoffset={ringOffset}
              style={{ transition: "stroke-dashoffset 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)" }}
            />
          </svg>
          <div style={{
            position: "absolute", inset: 0,
            display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "center",
            pointerEvents: "none",
          }}>
            <div style={{
              fontFamily: fontStat, fontSize: 44, fontWeight: 700,
              lineHeight: 0.9, color: COLORS.ink, letterSpacing: "0.01em",
            }}>{pct}%</div>
            <div style={{
              fontFamily: fontMono, fontSize: 9,
              letterSpacing: "0.16em", textTransform: "uppercase",
              color: COLORS.mute, marginTop: 4,
            }}>marked</div>
          </div>
        </div>

        <div style={{ flex: 1 }}>
          <div style={{
            fontFamily: fontMono, fontSize: 10,
            letterSpacing: "0.16em", textTransform: "uppercase",
            color: COLORS.mute, marginBottom: 8,
          }}>Active Positions</div>
          <div style={{
            fontFamily: fontHead, fontSize: 22, lineHeight: 1.15,
            color: COLORS.ink, fontWeight: 500, letterSpacing: "-0.01em",
            marginBottom: 8,
          }}>
            {activeMarked} of {activeCount} carry a verified mark.
          </div>
          <div style={{
            fontFamily: fontBody, fontSize: 13, color: COLORS.mute,
            lineHeight: 1.45,
          }}>
            {activeAtCost > 0
              ? `${activeAtCost} ${activeAtCost === 1 ? "position is" : "positions are"} held at $50K cost basis pending last-round data.`
              : "All active positions carry a current mark."}
          </div>
        </div>
      </div>

      {/* Breakdown rows */}
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <CoverageRow
          label="Active — marked to last round"
          value={activeMarked}
          total={activeCount}
          tone="ink"
        />
        <CoverageRow
          label="Active — held at cost"
          value={activeAtCost}
          total={activeCount}
          tone="mute"
        />
        <CoverageRow
          label="Exits — proceeds recorded"
          value={exitedKnown}
          total={exitedTotal}
          tone="gold"
        />
        {exitedUnknown > 0 && (
          <CoverageRow
            label="Exits — pending proceeds data"
            value={exitedUnknown}
            total={exitedTotal}
            tone="mute"
          />
        )}
      </div>
    </div>
  );
}

function CoverageRow({ label, value, total, tone }) {
  const pct = total > 0 ? (value / total) * 100 : 0;
  const colorMap = {
    ink: COLORS.ink,
    gold: COLORS.goldDeep,
    mute: COLORS.muteSoft,
  };
  const fg = colorMap[tone] || COLORS.ink;
  return (
    <div style={{
      display: "grid",
      gridTemplateColumns: "1fr auto",
      alignItems: "center",
      gap: 12,
    }}>
      <div>
        <div style={{
          fontFamily: fontBody, fontSize: 12.5,
          color: COLORS.inkSoft, marginBottom: 4,
        }}>{label}</div>
        <div style={{ height: 4, background: COLORS.card, position: "relative" }}>
          <div style={{
            position: "absolute", left: 0, top: 0, bottom: 0,
            width: `${pct}%`, background: fg,
            transition: "width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)",
          }} />
        </div>
      </div>
      <div style={{
        fontFamily: fontMono, fontSize: 12, color: COLORS.ink,
        whiteSpace: "nowrap",
      }}>
        <span style={{ fontWeight: 600 }}>{value}</span>
        <span style={{ color: COLORS.muteSoft }}> / {total}</span>
      </div>
    </div>
  );
}

function CohortBlock({ label, value, sub, highlight }) {
  return (
    <div style={{
      padding: "16px 18px",
      background: highlight ? COLORS.goldPale : COLORS.bg,
      border: `1px solid ${highlight ? COLORS.goldDeep : "rgba(0,0,0,0.08)"}`,
    }}>
      <div style={{
        fontFamily: fontMono, fontSize: 9.5,
        letterSpacing: "0.18em", textTransform: "uppercase",
        color: COLORS.mute, marginBottom: 8,
      }}>{label}</div>
      <div style={{
        fontFamily: fontStat, fontSize: 44, fontWeight: 700,
        lineHeight: 0.85, letterSpacing: "0.01em", color: COLORS.ink,
      }}>{value}</div>
      <div style={{
        fontFamily: fontBody, fontSize: 12, color: COLORS.mute,
        marginTop: 6,
      }}>{sub}</div>
    </div>
  );
}

function InsightTile({ kicker, value, stat, description, tone = "gold" }) {
  const isDark = tone === "dark";
  return (
    <div style={{
      background: isDark ? COLORS.ink : COLORS.paper,
      color: isDark ? COLORS.paper : COLORS.ink,
      padding: 24,
      border: `1px solid ${isDark ? COLORS.ink : "rgba(0,0,0,0.08)"}`,
      position: "relative",
      overflow: "hidden",
    }}>
      {!isDark && (
        <span style={{
          position: "absolute", top: 0, right: 0,
          width: 8, height: 32, background: COLORS.gold,
        }} />
      )}
      {isDark && (
        <span style={{
          position: "absolute", top: 0, left: 0,
          width: 32, height: 8, background: COLORS.gold,
        }} />
      )}
      <div style={{
        fontFamily: fontMono, fontSize: 10,
        letterSpacing: "0.2em", textTransform: "uppercase",
        color: isDark ? COLORS.gold : COLORS.mute,
        marginBottom: 10,
      }}>{kicker}</div>
      <div style={{
        fontFamily: fontHead, fontSize: 32, fontWeight: 500,
        lineHeight: 1, letterSpacing: "-0.02em",
        marginBottom: 8,
      }}>{value}</div>
      <div style={{
        fontFamily: fontMono, fontSize: 11.5,
        color: isDark ? "rgba(255,255,255,0.65)" : COLORS.inkSoft,
        marginBottom: 12, letterSpacing: "0.02em",
      }}>{stat}</div>
      <div style={{
        fontFamily: fontBody, fontSize: 13, lineHeight: 1.5,
        color: isDark ? "rgba(255,255,255,0.75)" : COLORS.inkSoft,
      }}>{description}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
